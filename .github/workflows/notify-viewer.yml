name: Rebuild the viewer

# Tells Gangleri42/seedhammer-viewer to convert and publish the new model version.
on:
  push:
    branches: [main]
    paths: ['seed/**', 'hammer/**', 'II/**']
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-24.04
    steps:
      - name: Send hardware-updated to seedhammer-viewer
        env:
          TOKEN: ${{ secrets.VIEWER_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Gangleri42/seedhammer-viewer/dispatches \
            -d "{\"event_type\":\"hardware-updated\",\"client_payload\":{\"sha\":\"$SHA\"}}"
